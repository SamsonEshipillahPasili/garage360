{% extends 'app_shell.html' %}

{% load crispy_forms_tags %}
{% load static %}

{% block css %}
    {{ block.super }}
    <link href="{% static 'accounts/css/login.css' %}" rel="stylesheet" />
{% endblock %}

{% block content %}

<div class="login-wrapper py-4 py-md-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <div class="card login-card border-0 shadow-lg">
                    <!-- Header -->
                    <div class="login-card-header text-center p-4 p-md-5">
                        <div class="login-brand-icon mb-3">
                            <i class="bi bi-gear-wide-connected"></i>
                        </div>
                        <h2 class="fw-bold text-dark mb-2 fs-3">Login</h2>
                        <p class="text-secondary small mb-0">Sign in to access your Garage360 portal</p>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4">
                        {% include 'partials/alerts.html' %}
                        
                        {% crispy form %}
                    </div>

                    <!-- Footer -->
                    <div class="card-footer bg-light border-0 py-3 text-center">
                        <small class="text-muted">
                            <i class="bi bi-shield-check me-1 text-primary"></i> Garage360 Secure Portal
                        </small>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

{% endblock %}
