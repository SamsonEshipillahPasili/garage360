{% extends 'base.html' %}

{% load static %}

{% block body %}
<nav class="navbar navbar-expand-lg" style="background-color: #e3f2fd;" data-bs-theme="light">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Garage360</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link {% if menu_item == 'clients' %} active {% endif %}" aria-current="page" href="{% url 'accounts:list_profiles' %}">Clients</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if menu_item == 'staff' %} active {% endif %}" href="{% url 'accounts:list_profiles'%}?is_staff=true">Staff</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if menu_item == 'list_all_bookings' %} active {% endif %}" href="{% url 'core:list_bookings' %}">Bookings</a>
        </li>
        <li class="nav-item">
          <form action="{% url 'accounts:logout' %}" method="post">
            {% csrf_token %}
            <button class="nav-link">Logout</button>
          </form>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

{% block content %} {% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
{% endblock %}
